name: Verify Travel Planning Kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
      - run: python -m travel_kit demo --output output/ci-demo
  browser-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-browser.py
      - run: python scripts/build-release.py
      - run: python -m venv /tmp/travel-wheel
      - run: /tmp/travel-wheel/bin/pip install --no-deps artifacts/release/*.whl
      - run: cd /tmp && /tmp/travel-wheel/bin/travel-kit demo --output travel-installed-demo
